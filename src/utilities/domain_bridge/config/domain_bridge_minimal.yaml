name: domain_bridge_minimal
from_domain: 79
to_domain: 80
topics:
  # Robot -> Host (minimum needed by host-side VLM + monitoring)
  # camera/image/compressed is intentionally not bridged in minimal mode
  # to protect robot-side localization/control timing over Wi-Fi.
  registered_scan:
    type: sensor_msgs/msg/PointCloud2
    qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 1
  state_estimation:
    type: nav_msgs/msg/Odometry
  tf:
    type: tf2_msgs/msg/TFMessage
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
  tf_static:
    type: tf2_msgs/msg/TFMessage
    qos:
      reliability: reliable
      durability: transient_local
      history: keep_last
      depth: 10

  # Host -> Robot (minimum needed for control)
  way_point:
    type: geometry_msgs/msg/PointStamped
    reversed: True
  stop:
    type: std_msgs/msg/Int8
    reversed: True
