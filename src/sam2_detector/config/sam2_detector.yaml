sam2_detector:
  ros__parameters:
    # YOLOE TensorRT backend.
    # Path to the engine file, relative to vln_repo_path.
    yoloe_engine_path: "checkpoints/yoloe-11l-real_world.engine"

    # Root of the VLN_CL_CoTNav repo (used to resolve yoloe_engine_path).
    vln_repo_path: "../"

    # Scene mode (kept for compatibility; no longer affects goal translation).
    scene_mode: "real_world"

    # Minimum YOLOE confidence to keep a detection.
    box_threshold: 0.3

    # Maximum detection frequency (Hz).
    inference_hz: 1.0

    # GPU device for YOLOE inference.
    device: "cuda:0"

    # ROS topic supplying the egocentric RGB image for detection.
    camera_topic: "/egocentric_rgb"
